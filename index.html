<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA Games Center</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    font-family:Roboto,sans-serif;
    background:#0F0F23;
    color:#E0E0E0;
    margin:0;
}
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}
header{
    text-align:center;
    margin-bottom:30px;
}
.logo{
    font-size:30px;
    font-weight:bold;
    color:#fff;
}
.hero{
    background:url("https://i.postimg.cc/C1KqDrFn/LXlAPV.jpg") center/cover no-repeat;
    border-radius:15px;
    padding:60px 20px;
    text-align:center;
    margin-bottom:40px;
}
.hero h1{font-size:42px;color:#fff;}
.hero p{font-size:18px;}

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.game-card{
    background:#1E1E3A;
    border-radius:15px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.game-card img{
    width:100%;
    height:170px;
    object-fit:cover;
}
.game-info{
    padding:15px;
}
.game-info h3{
    color:#fff;
    margin-bottom:10px;
}
.game-details{
    font-size:14px;
    margin-bottom:15px;
}
.game-details span{
    margin:0 6px;
}
.cta-button{
    display:inline-block;
    background:linear-gradient(to right,#9C27B0,#6A059B);
    color:#fff;
    padding:12px 35px;
    border-radius:30px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}
.cta-button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">Games4You</div>
</header>

<div class="hero">
    <h1>Discover Endless Fun!</h1>
    <p>Install the best mobile games and get exclusive rewards</p>
</div>

<div class="games-grid">

    <!-- GAME 1 -->
    <div class="game-card">
        <img src="https://static.divxland.org/wp-content/uploads/2025/10/carx-street-screenshot-1.png">
        <div class="game-info">
            <h3>CarX Street</h3>
            <div class="game-details">
                <span><i class="fab fa-android"></i> Android</span>
                <span><i class="fab fa-apple"></i> iOS</span><br>
                <span>⭐ 8.5</span> | <span>2.1GB</span>
            </div>
            <a class="cta-button cpa-link">Install Now</a>
        </div>
    </div>

    <!-- GAME 2 -->
    <div class="game-card">
        <img src="https://images.wallpapersden.com/image/download/dota-2-logo-neon_Zmhnam2UmZqaraWkpJRmbmdlrWZlbWU.jpg">
        <div class="game-info">
            <h3>Dota 2</h3>
            <div class="game-details">
                <span><i class="fab fa-android"></i> Android</span>
                <span><i class="fab fa-apple"></i> iOS</span><br>
                <span>⭐ 7.9</span> | <span>1.7GB</span>
            </div>
            <a class="cta-button cpa-link">Install Now</a>
        </div>
    </div>

    <!-- GAME 3 -->
    <div class="game-card">
        <img src="https://cdn.forza.net/strapi-uploads/assets/FH_5_Evergreen_Key_Art_Horizontal_3840x2160_RGB_337636ab7f.jpg">
        <div class="game-info">
            <h3>Forza Horizon 5</h3>
            <div class="game-details">
                <span><i class="fab fa-android"></i> Android</span>
                <span><i class="fab fa-apple"></i> iOS</span><br>
                <span>⭐ 8.5</span> | <span>2.8GB</span>
            </div>
            <a class="cta-button cpa-link">Install Now</a>
        </div>
    </div>

</div>
</div>

<!-- CPA SCRIPT -->
<script type="text/javascript" id="ogjs" src="https://mirror.modxplay.online/cl/js/1xx321"></script>

<script>
document.querySelectorAll('.cpa-link').forEach(function(btn){
    btn.addEventListener('click', function(){
        if(typeof og_load === "function"){
            og_load();
        }
    });
});
</script>

</body>
</html>
